name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      yugo: ${{ steps.filter.outputs.yugo }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - 'src/**'
              - 'test/**'
              - 'schema/**'
              - 'conformance/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            yugo:
              - 'yugo/**'
              - 'schema/**'
              - 'conformance/**'
              # bin/yugo is COPYed into the image and is the command the dedup
              # startup gate's error names, so a change to it can break a bot's
              # only documented recovery. Outside yugo/, hence its own line.
              - 'bin/**'
              - '.github/workflows/ci.yml'

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - name: Typecheck shipped sources
        run: bunx tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target esnext --strict --allowImportingTsExtensions src/fleet-bus.ts conformance/run-ts.ts
      - name: Unit tests
        run: bun test src
      - name: Conformance vectors
        run: bun conformance/run-ts.ts
      - name: Vector file is valid JSON
        run: bun -e 'JSON.parse(require("fs").readFileSync("conformance/envelope.v1.vectors.json","utf8"))'

  yugo-conformance:
    needs: changes
    if: needs.changes.outputs.yugo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yugo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            yugo/requirements.txt
            yugo/test-requirements.txt
      - name: install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r test-requirements.txt
      - name: run envelope conformance vectors
        run: pytest test/test_conformance.py -v

  yugo-docker-build:
    needs: changes
    if: needs.changes.outputs.yugo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -f yugo/Dockerfile -t yugo-ci .
      - name: verify container imports under documented .env.example
        run: |
          docker run --rm --env-file yugo/.env.example \
            --entrypoint python yugo-ci -c \
            "import bot, history, fleet_bus, tools, nats; print('IMPORT OK')"
      - name: verify default entrypoint dispatches both modes
        run: |
          set +e
          bot_out=$(timeout 30s docker run --rm --env-file yugo/.env.example \
            -e YUGO_MODE=bot yugo-ci 2>&1)
          bot_code=$?
          coord_out=$(docker run --rm --env-file yugo/.env.example \
            -e YUGO_MODE=coordinator yugo-ci 2>&1)
          coord_code=$?
          set -e
          echo "$bot_out"
          echo "$coord_out"
          test $bot_code -ne 0
          echo "$bot_out" | grep -Eqi 'token|login|unauthorized|discord'
          test $coord_code -ne 0
          echo "$coord_out" | grep -q FLEET_BUS_USER
      - name: verify bus-enabled container aborts on a missing token file
        run: |
          set +e
          out=$(docker run --rm --env-file yugo/.env.example \
            -e FLEET_BUS_ENABLED=1 -e BOT_NAME=yugo \
            --entrypoint python yugo-ci -c "import bot" 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -ne 0 || { echo "expected a startup abort, got exit 0"; exit 1; }
          echo "$out" | grep -q FLEET_BUS_TOKEN_FILE \
            || { echo "abort message did not name FLEET_BUS_TOKEN_FILE"; exit 1; }
      # The steps above all run with the bus off, so nothing here ever built a
      # durable dedup store and SPEC-26 §8's hard startup gate had no container
      # coverage at all (#51). This walks the operator's documented recovery
      # using the paths the docs name, so the INSTRUCTIONS are under test and
      # not just the mechanism: a record provisioned against some other mount
      # binds an inode the bot never opens and refuses all over again.
      #
      # The one thing it cannot use is the real entrypoint. `start_bus` is
      # called from discord.py's `setup_hook`, which runs only after a
      # successful `static_login`, so an unprovisioned container run normally
      # dies on `LoginFailure` long before the dedup gate. Reaching the gate
      # through `docker compose up` would need a live Discord token. The probe
      # below calls the same `bot.start_bus()` that `setup_hook` calls.
      - name: verify the file-backed dedup gate refuses, names a command the image has, and clears
        run: |
          set -euo pipefail
          # Read the mount off compose.example.yml rather than hardcoding it, so
          # that moving the mount without updating .env.example fails here.
          read -r host_dir container_dir <<EOF
          $(python3 -c "
          import yaml
          volumes = yaml.safe_load(open('yugo/compose.example.yml'))['services']['bot']['volumes']
          source, target = next(v.rsplit(':', 1) for v in volumes if v.endswith('/var/lib/yugo'))
          print(source.lstrip('./'), target)
          ")
          EOF
          # A failed command substitution inside a heredoc does not trip `set -e`,
          # and empty values would make every grep below match anything.
          test -n "$host_dir" && test -n "$container_dir" \
            || { echo "could not read the bot service's /var/lib/yugo mount from yugo/compose.example.yml"; exit 1; }
          echo "compose mounts ./$host_dir at $container_dir"
          grep -q -- "$host_dir:$container_dir" yugo/.env.example \
            || { echo ".env.example does not provision into compose's $host_dir:$container_dir mount"; exit 1; }
          store="$container_dir/yugo-dedup.sqlite"       # the documented blank-YUGO_DEDUP_STORE_PATH default
          record="$container_dir/yugo-dedup.record.json"  # the documented --record path
          grep -q -- "YUGO_DEDUP_VERIFICATION_RECORD=$container_dir/" yugo/.env.example \
            || { echo ".env.example does not show the in-container record path to assign"; exit 1; }

          deploy="$RUNNER_TEMP/deploy"
          rm -rf "$deploy" && mkdir -p "$deploy/$host_dir"
          printf 'ci-token\n' > "$deploy/token"
          printf 'bot_names: [yugo]\n' > "$deploy/fleet-manifest.yaml"
          # `setup_hook`'s call, without the Discord login that guards it.
          cat > "$deploy/probe.py" <<'PY'
          import asyncio, bot
          async def main():
              task = bot.start_bus()
              task.cancel()   # asserts nothing about NATS: unreachable is not a config fault
              await asyncio.gather(task, return_exceptions=True)
          asyncio.run(main())
          print("BUS STARTED")
          PY
          # YUGO_DEDUP_STORE_PATH is deliberately NOT overridden: blank is what
          # .env.example ships, and its default has to land inside this mount.
          busrun() {
            docker run --rm \
              -v "$deploy/$host_dir:$container_dir" \
              -v "$deploy/probe.py:/probe.py:ro" \
              --env-file yugo/.env.example \
              -e FLEET_BUS_ENABLED=1 -e BOT_NAME=yugo \
              -e FLEET_BUS_TOKEN_FILE=/probe-token \
              -e FLEET_BUS_MANIFEST_PATH=/probe-manifest.yaml \
              -e FLEET_BUS_AUDIT_LOG="$container_dir/fleet-bus-log.jsonl" \
              -v "$deploy/token:/probe-token:ro" \
              -v "$deploy/fleet-manifest.yaml:/probe-manifest.yaml:ro" \
              "$@"
          }
          provision() {
            printf 'STOPPED\n%s\n%s\nATTEST\n' \
              "{\"device_path\":\"unresolved\",\"mount_point\":\"$container_dir\",\"fstype\":\"unresolved\",\"mount_id_source\":\"unresolved\",\"backing\":\"local-block\",\"determined_by\":\"CI fixture, not a deployment attestation\",\"inspected_at\":\"2026-09-29T00:00:00Z\"}" \
              "[{\"process\":\"ci-probe\",\"user\":\"root\",\"path\":\"$store\",\"method\":\"none\"}]" \
              | busrun -i --entrypoint yugo yugo-ci dedup provision \
                  --port python --attested-by yugo-docker-build \
                  --store "$store" --record "$record" "$@"
          }
          # 1. The variable must be declared in the documented deployment env,
          #    or the operator meets the gate for the first time in production.
          docker run --rm --env-file yugo/.env.example --entrypoint python yugo-ci -c \
            "import os, sys; sys.exit('YUGO_DEDUP_VERIFICATION_RECORD' not in os.environ)" \
            || { echo "YUGO_DEDUP_VERIFICATION_RECORD is not declared in yugo/.env.example"; exit 1; }
          # 2. Unprovisioned, the container must refuse rather than start blind.
          set +e
          refusal=$(busrun --entrypoint python yugo-ci /probe.py 2>&1)
          refusal_code=$?
          set -e
          echo "$refusal"
          test $refusal_code -ne 0 || { echo "expected a dedup startup refusal, got exit 0"; exit 1; }
          echo "$refusal" | grep -q "$store" \
            || { echo "refusal did not name the documented default store path"; exit 1; }
          echo "$refusal" | grep -q 'missing verification record' \
            || { echo "refusal did not name the missing verification record"; exit 1; }
          # 3. The command that refusal names must exist in THIS image.
          echo "$refusal" | grep -q 'run yugo dedup provision' \
            || { echo "refusal did not name the provisioning command"; exit 1; }
          docker run --rm --entrypoint yugo yugo-ci dedup provision --help > /dev/null \
            || { echo "the image lacks the 'yugo dedup provision' its own error names"; exit 1; }
          # 4. Following the documented provision must clear the refusal.
          provision
          started=$(busrun -e YUGO_DEDUP_VERIFICATION_RECORD="$record" \
            --entrypoint python yugo-ci /probe.py 2>&1)
          echo "$started"
          echo "$started" | grep -q 'BUS STARTED' \
            || { echo "provisioning did not clear the refusal"; exit 1; }
          # 5. Re-attestation is a different documented operation (SPEC-26 §8.5,
          #    and §8.6 step 5). A fresh provision over an existing store must
          #    refuse, and --record-only must work and keep the bot starting.
          set +e
          again=$(provision 2>&1)
          again_code=$?
          set -e
          echo "$again"
          test $again_code -ne 0 \
            || { echo "a fresh provision overwrote an existing store"; exit 1; }
          provision --record-only
          reattested=$(busrun -e YUGO_DEDUP_VERIFICATION_RECORD="$record" \
            --entrypoint python yugo-ci /probe.py 2>&1)
          echo "$reattested"
          echo "$reattested" | grep -q 'BUS STARTED' \
            || { echo "--record-only re-attestation did not produce a usable record"; exit 1; }

  yugo-pytest:
    needs: changes
    if: needs.changes.outputs.yugo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yugo
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            yugo/requirements.txt
            yugo/test-requirements.txt
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
      - name: install nats-server
        run: |
          curl -sSfL -o /tmp/nats-server.zip \
            https://github.com/nats-io/nats-server/releases/download/v2.10.22/nats-server-v2.10.22-linux-amd64.zip
          unzip -q -o /tmp/nats-server.zip -d /tmp
          sudo install /tmp/nats-server-v2.10.22-linux-amd64/nats-server /usr/local/bin/
          nats-server --version
      - name: pytest
        run: pytest test/ -v -rs

  native-clock-regression:
    # Runner regression evidence, NOT deployment-host qualification.
    # Match the adapter's supported runtime/libc; never weaken its guard.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: bun install --frozen-lockfile
      - name: Assert runner ABI against runner headers
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.39"
          cc -std=c11 -D_POSIX_C_SOURCE=200809L conformance/clock-abi.c -o "$RUNNER_TEMP/clock-abi"
          "$RUNNER_TEMP/clock-abi"
      - name: Actual native API cross-process regression
        env:
          YUGO_QUALIFIED_CLOCK_TEST: "1"
          PYTHON: python
        run: bun test src/clock-fencing.test.ts --test-name-pattern '^13 and 15 cross-port expiry agrees using actual named clock APIs$'
      - name: SPEC-26 15a two-process lease regression
        env:
          YUGO_QUALIFIED_CLOCK_TEST: "1"
          PYTHON: python
        run: bun test src/clock-fencing-two-process.test.ts
      - name: SPEC-26 15b post-startup clock failure and no-mutation matrix
        env:
          YUGO_QUALIFIED_CLOCK_TEST: "1"
        run: bun test src/clock-fault-injection.test.ts
      - name: Native result validation regressions
        run: bun test src/monotonic-clock.test.ts

  release1-wide-insert:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: feca1162faff8f370ca723a862dcbe3552961d0d
          path: release1-checkout
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: bun install --frozen-lockfile
      - name: Real Release-1 seven-column regressions
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/release1-checkout/yugo" python conformance/release1-wide-insert.py
          RELEASE1_CHECKOUT="$GITHUB_WORKSPACE/release1-checkout" bun conformance/release1-wide-insert.ts
      - name: Revert real named INSERTs and require the exact regression failure
        env:
          RELEASE1_CHECKOUT: ${{ github.workspace }}/release1-checkout
        run: python conformance/check-release1-mutations.py
