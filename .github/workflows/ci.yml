name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      yugo: ${{ steps.filter.outputs.yugo }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - 'src/**'
              - 'test/**'
              - 'schema/**'
              - 'conformance/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            yugo:
              - 'yugo/**'
              - 'schema/**'
              - 'conformance/**'
              - '.github/workflows/ci.yml'

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - name: Typecheck shipped sources
        run: bunx tsc --noEmit --skipLibCheck --module esnext --moduleResolution bundler --target esnext --strict --allowImportingTsExtensions src/fleet-bus.ts conformance/run-ts.ts
      - name: Unit tests
        run: bun test src/fleet-bus.test.ts
      - name: Conformance vectors
        run: bun conformance/run-ts.ts
      - name: Vector file is valid JSON
        run: bun -e 'JSON.parse(require("fs").readFileSync("conformance/envelope.v1.vectors.json","utf8"))'

  yugo-conformance:
    needs: changes
    if: needs.changes.outputs.yugo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yugo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            yugo/requirements.txt
            yugo/test-requirements.txt
      - name: install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r test-requirements.txt
      - name: run envelope conformance vectors
        run: pytest test/test_conformance.py -v

  yugo-docker-build:
    needs: changes
    if: needs.changes.outputs.yugo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -f yugo/Dockerfile -t yugo-ci .
      - name: verify container imports under documented .env.example
        run: |
          docker run --rm --env-file yugo/.env.example \
            --entrypoint python yugo-ci -c \
            "import bot, history, fleet_bus, tools, nats; print('IMPORT OK')"
      - name: verify default entrypoint dispatches both modes
        run: |
          set +e
          bot_out=$(timeout 30s docker run --rm --env-file yugo/.env.example \
            -e YUGO_MODE=bot yugo-ci 2>&1)
          bot_code=$?
          coord_out=$(docker run --rm --env-file yugo/.env.example \
            -e YUGO_MODE=coordinator yugo-ci 2>&1)
          coord_code=$?
          set -e
          echo "$bot_out"
          echo "$coord_out"
          test $bot_code -ne 0
          echo "$bot_out" | grep -Eqi 'token|login|unauthorized|discord'
          test $coord_code -ne 0
          echo "$coord_out" | grep -q FLEET_BUS_USER
      - name: verify bus-enabled container aborts on a missing token file
        run: |
          set +e
          out=$(docker run --rm --env-file yugo/.env.example \
            -e FLEET_BUS_ENABLED=1 -e BOT_NAME=yugo \
            --entrypoint python yugo-ci -c "import bot" 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -ne 0 || { echo "expected a startup abort, got exit 0"; exit 1; }
          echo "$out" | grep -q FLEET_BUS_TOKEN_FILE \
            || { echo "abort message did not name FLEET_BUS_TOKEN_FILE"; exit 1; }

  yugo-pytest:
    needs: changes
    if: needs.changes.outputs.yugo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yugo
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            yugo/requirements.txt
            yugo/test-requirements.txt
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
      - name: install nats-server
        run: |
          curl -sSfL -o /tmp/nats-server.zip \
            https://github.com/nats-io/nats-server/releases/download/v2.10.22/nats-server-v2.10.22-linux-amd64.zip
          unzip -q -o /tmp/nats-server.zip -d /tmp
          sudo install /tmp/nats-server-v2.10.22-linux-amd64/nats-server /usr/local/bin/
          nats-server --version
      - name: pytest
        run: pytest test/ -v -rs
