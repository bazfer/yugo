# Merge these accounts into the JetStream-enabled fleet broker config. Replace
# CHANGEME values through the deployment secret mechanism. Repeat BOT_FLEET_BOT
# once per bot, changing both the account suffix and every fleet.fleet-bot.*
# subject to that bot's exact identity.
#
# Account isolation is load-bearing. A JetStream publisher chooses the reply
# subject for its PubAck. If bots shared FLEET's account, a malicious bot could
# name fleet.<peer>.inbox and make the server reflect its PubAck into that
# durable inbox even though the bot cannot publish there directly. A service
# import keeps that reply inside the caller's isolated account; only the
# requested message crosses into FLEET, where the streams live.
accounts {
  FLEET {
    jetstream: enabled
    users = [
      {
        user: coordinator
        password: "CHANGEME_COORDINATOR"
        permissions: {
          publish: {
            # JetStream grants are limited to request-stream discovery and this
            # role's durable pull consumer. STREAM.DELETE/PURGE stay forbidden.
            allow: [
              "fleet.*.inbox",
              "fleet.*.status",
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.FLEET_REQUEST",
              "$JS.API.CONSUMER.CREATE.FLEET_REQUEST.>",
              "$JS.API.CONSUMER.DURABLE.CREATE.FLEET_REQUEST.>",
              "$JS.API.CONSUMER.INFO.FLEET_REQUEST.*",
              "$JS.API.CONSUMER.MSG.NEXT.FLEET_REQUEST.*",
              "$JS.ACK.FLEET_REQUEST.>",
              "_INBOX_coordinator.>"
            ]
          }
          subscribe: { allow: ["fleet.>", "_INBOX.>", "_INBOX_coordinator.>"] }
        }
      }
      {
        user: console
        password: "CHANGEME_CONSOLE"
        permissions: {
          publish: { deny: [">"] }
          subscribe: { allow: ["fleet.>"] }
        }
      }
      # TEST_PROVISIONER
    ]
    exports = [
      {service: "fleet.*.request", accounts: [BOT_FLEET_BOT]}
      {service: "fleet.*.result", accounts: [BOT_FLEET_BOT]}
      {stream: "fleet.fleet-bot.inbox", accounts: [BOT_FLEET_BOT]}
    ]
  }

  BOT_FLEET_BOT {
    users = [
      {
        user: fleet-bot
        password: "CHANGEME_BOT"
        permissions: {
          publish: {
            allow: ["fleet.>"]
            deny: ["fleet.*.inbox"]
          }
          subscribe: {
            # .request/.result are the temporary FB-3 migration exception.
            allow: [
              "fleet.fleet-bot.request",
              "fleet.fleet-bot.result",
              "fleet.fleet-bot.inbox",
              "fleet.fleet-bot.status",
              "fleet.broadcast.>"
            ]
          }
        }
      }
    ]
    imports = [
      {service: {account: FLEET, subject: "fleet.*.request"}}
      {service: {account: FLEET, subject: "fleet.*.result"}}
      {stream: {account: FLEET, subject: "fleet.fleet-bot.inbox"}}
    ]
  }
}
