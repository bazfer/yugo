authorization {
  users = [
    {
      user: coordinator
      password: "COORDINATOR_PASSWORD"
      permissions: {
        publish: { allow: [
          "fleet.*.inbox",
          "fleet.coordinator.status",
          "$JS.API.INFO",
          "$JS.API.STREAM.INFO.FLEET_REQUEST",
          "$JS.API.CONSUMER.CREATE.FLEET_REQUEST.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.FLEET_REQUEST.>",
          "$JS.API.CONSUMER.INFO.FLEET_REQUEST.*",
          "$JS.API.CONSUMER.MSG.NEXT.FLEET_REQUEST.*",
          "$JS.ACK.FLEET_REQUEST.>",
          "_INBOX_coordinator.>"
        ] }
        subscribe: { allow: ["fleet.>", "_INBOX_coordinator.>"] }
      }
    },
    {user: provisioner, password: "PROVISIONER_PASSWORD"},
    {user: sender, password: "SENDER_PASSWORD", permissions: {
      publish: {allow: ["fleet.*.request"]}
      subscribe: {allow: ["fleet.sender.inbox"]}
    }}
  ]
}
